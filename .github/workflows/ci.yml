name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One job, and it runs the unit and invariant suites only.
#
# The fork suite is deliberately not here. Its three files read `BASE_RPC_URL` through
# `vm.envOr` and skip themselves when it is unset, so they cost nothing by being absent -
# and wiring a mainnet RPC secret into a public repository's Actions is a larger decision
# than a test job. Run them locally with `BASE_RPC_URL` set; the README says how.
#
# Allow several minutes. The invariant suites dominate: `foundry.toml` sets 256 runs at
# depth 500, and that is the setting that makes them worth having.
jobs:
  test:
    name: forge test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `forge-std` and `openzeppelin-contracts` are git submodules. Without this the
          # checkout succeeds, every import fails, and the failure reads like a broken
          # remapping rather than a missing checkout flag.
          #
          # `true` rather than `recursive`, deliberately. Recursive additionally fetches
          # OpenZeppelin's own `erc4626-tests` and `halmos-cheatcodes`, which nothing in this
          # repository imports. It used to matter for a worse reason: forge auto-detected
          # remappings from what was on disk under `lib/`, so a recursive checkout appended one
          # per nested submodule, and since `remappings` is a solc metadata field hashed into
          # every contract's CBOR trailer, CI and an ordinary clone compiled different bytecode
          # from the same commit. `foundry.toml` pins remappings now, so the two agree. Verified
          # from a cold clone: 4,997 bytes of `CreditWiring` initcode and two remappings either
          # way.
          submodules: true
          # The scope check below diffs against the base branch.
          fetch-depth: 0

      # Seven paths exist only in this repository. They have no counterpart in the working tree
      # this source is ported from, so a wholesale copy of that tree over this one deletes six of
      # them and takes the published risk disclosure in README.md with it.
      #
      # Nothing checked that until now. The last sync's safety rested entirely on the person doing
      # it remembering, which is the shape this project has recorded four times.
      #
      # Two honest limits, stated rather than left to be found:
      #
      #  - Listing `.github/workflows/ci.yml` here is close to vacuous, because if that file is
      #    deleted this job does not run and nothing fails. It is named anyway so the set lives in
      #    one place; the gap it leaves cannot be closed from inside CI and needs a branch
      #    protection rule requiring this check.
      #  - This proves the files EXIST. It does not prove their contents are current, and all
      #    three of AUDITS.md, KNOWN_RISKS.md and REVIEW.md carried stale figures into the last
      #    sync. No detector in either repository reads them.
      #
      # First step in the job deliberately: it costs a second and it should fail before a
      # multi-minute toolchain install and test run, not after one.
      - name: Public-only files survived the sync
        run: |
          missing=""
          for f in .github/workflows/ci.yml .gitignore .gitmodules AUDITS.md KNOWN_RISKS.md LICENSE REVIEW.md; do
            [ -f "$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "These paths exist only in this repository and are gone:$missing"
            echo "They have no counterpart in the tree this source is synced from, so a wholesale"
            echo "copy over this one removes them. Restore them from this repository's own history."
            echo "Do not re-derive them: there is nowhere else to copy them from."
            exit 1
          fi
          if ! grep -q '^## Activation blockers and residual risks' README.md; then
            echo "README.md has lost its '## Activation blockers and residual risks' section."
            echo "That section is the published disclosure of what still blocks the LenderPool, and"
            echo "it exists only here. The README this source is synced from shares its H1 with this"
            echo "file and nothing else, so the section cannot be recovered by copying it in again."
            echo "Restore it from this repository's own history."
            exit 1
          fi
          echo "All seven public-only paths present, and README.md still carries its disclosure."

      # The limit the step above states out loud - "this proves the files EXIST, it does not prove
      # their contents are current" - is what this step starts closing.
      #
      # On 2026-08-31 the Solidity in this repository was replaced and the risk register was not.
      # KNOWN_RISKS.md went on naming `netDeposits` and `QueueHeldByReserve`, neither of which
      # exists in the source that shipped beside it, while saying nothing about `_accountedCash`,
      # which appears two dozen times in LenderPool.sol. Three findings stood published as live
      # activation blockers against a pool that had been deleted. This checks the weaker property
      # that would nonetheless have caught all of it: every name the documentation prints as code
      # is a name the source still uses. The script's own header states what it does not check.
      #
      # Deliberately on the ungated side, above the scope check and before the toolchain:
      #
      #  - A documentation-only pull request is exactly the kind this catches, so gating it behind
      #    `steps.scope.outputs.run` would switch it off for its own case. That is the same mistake
      #    a workflow-level `paths:` filter would make, and the comment below says why that one was
      #    refused too.
      #  - It needs no build, no artifacts and no `forge`, so it has nothing to wait for.
      #  - It is Node builtins only, with no dependencies and no install step. GitHub's Ubuntu image
      #    ships Node; if that ever stops being true this step fails loudly rather than skipping.
      #
      # It is deliberately not added to the survival list above. Deleting the script makes this step
      # fail with a missing-file error on its own, which is the same protection without adding a
      # hand-maintained name to a count whose basis nobody can now re-derive.
      - name: Documentation names code that exists
        run: node .github/scripts/check-doc-identifiers.mjs

      - uses: foundry-rs/foundry-toolchain@v1

      # Documentation-only pull requests skip the build and the suite, which is thirteen
      # minutes they cannot affect the outcome of.
      #
      # 🟥 **Deliberately an in-job gate rather than a workflow-level `paths:` filter, and
      # the reason is the step immediately above this one.** A `paths:` filter would skip the whole
      # job on a documentation-only change, and the public-only survival check is precisely the
      # guard that a documentation change can defeat: a pull request deleting `KNOWN_RISKS.md`
      # touches nothing but markdown. Filtering at the workflow level would switch that guard off
      # for exactly the pull requests it exists to catch.
      #
      # The second reason is durability. `forge test` is not a required status check on this
      # repository today. If it is ever made one, a `paths:` filter becomes a trap: the check never
      # reports at all and the pull request waits forever. An in-job gate always reports.
      - name: Does this change touch anything but documentation?
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            changed=$(git diff --name-only HEAD^ HEAD)
          else
            changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          fi
          if printf '%s\n' "$changed" | grep -v '^$' | grep -qv '\.md$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Markdown only, so the build and the suite were skipped. The public-only" >> "$GITHUB_STEP_SUMMARY"
            echo "survival check above still ran, which is the one that matters here." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Show versions
        if: steps.scope.outputs.run == 'true'
        run: forge --version

      - name: Build
        if: steps.scope.outputs.run == 'true'
        run: forge build

      - name: Test
        if: steps.scope.outputs.run == 'true'
        run: forge test -vv
