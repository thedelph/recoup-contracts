[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]

# Public immutables use lowerCamelCase as part of the external API surface
[lint]
exclude_lints = ["screaming-snake-case-immutable"]

# These are forge's current defaults, written down rather than inherited. `fail_on_revert`
# is the one that matters: every invariant suite here wraps its interesting actions in
# `try` and assert a typed selector in the `catch`, which is only meaningful while a
# reverting handler call is discarded instead of failing the run. Most random sequences
# are meaningless and must be allowed to revert. Flipping this to `true` - by a forge
# default changing, or by someone passing the flag - breaks every suite at once, so the
# dependency belongs in the file rather than in the tool.
[invariant]
runs = 256
depth = 500
fail_on_revert = false

# Resolved lazily: an alias is only expanded when something asks for it, so an unset
# variable costs nothing on a plain `forge test`. The fork suite reads BASE_RPC_URL
# directly through `vm.envOr` and does not go through these aliases.
[rpc_endpoints]
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

# One key covers both networks, and it must be an **etherscan.io** key. Under the
# Etherscan V2 multichain API a single key serves every explorer in the family and
# legacy per-explorer keys (BaseScan, Polygonscan, BscScan) are rejected outright
# with "Invalid API key" - so a BaseScan key is not merely redundant here, it fails.
# `ETHERSCAN_API_KEY` is also the variable forge reads natively for
# `--etherscan-api-key`, so naming it anything else silently gives up that default.
#
# Without it `--verify` fails after a successful broadcast, which leaves contracts
# deployed but unverified rather than losing anything - re-run `forge verify-contract`
# in that case.
[etherscan]
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }
